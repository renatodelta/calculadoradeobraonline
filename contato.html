    </div>
</section>

<section class="calculator">
    <div class="container">
        <h3>Formulário de contato</h3>
        <form action="https://formspree.io/f/xwvnwjdg" method="POST">
            <div class="form-group">
                <label>Seu nome:</label>
                <input type="text" name="nome" placeholder="Ex: João Silva" required>
            </div>

            <div class="form-group">
                <label>Seu e-mail:</label>
                <input type="email" name="email" placeholder="Ex: joao@email.com" required>
            </div>

            <div class="form-group">
                <label>Assunto:</label>
                <input type="text" name="assunto" placeholder="Ex: Dúvida sobre cálculo" required>
            </div>

            <div class="form-group">
                <label>Sua mensagem:</label>
                <textarea name="message" placeholder="Descreva sua dúvida ou sugestão..." required style="min-height: 150px; resize: vertical;"></textarea>
            </div>

            <button type="submit" class="btn-primary">Enviar Mensagem</button>
        </form>
    </div>
</section>
